
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata
  template:
    metadata:
      labels:
        app: metadata
    spec:
      containers:
        - name: metadata
          image: distributed-storage:latest
          imagePullPolicy: Never
          command:
            - python
            - -m
            - uvicorn
            - metadata.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://storageuser:storagepass@postgres:5432/storagedb"
            - name: IN_DOCKER
              value: "true"
            - name: API_KEY
              value: "exam-demo-key"
            - name: RATE_LIMIT
              value: "120"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metadata
spec:
  selector:
    app: metadata
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
