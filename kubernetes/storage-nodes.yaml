apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node1-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node1
  template:
    metadata:
      labels:
        app: node1
    spec:
      containers:
        - name: node1
          image: distributed-storage:latest
          imagePullPolicy: Never
          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ID
              value: "node1"
            - name: STORAGE_DIR
              value: "/data"
            - name: METADATA_URL
              value: "http://metadata:8000"
          volumeMounts:
            - name: storage-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: node1-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: node1
spec:
  selector:
    app: node1
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
