apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node1
spec:
  serviceName: node1
  replicas: 1
  selector:
    matchLabels:
      app: node1
  template:
    metadata:
      labels:
        app: node1
    spec:
      containers:
        - name: node1
          image: distributed-storage:latest
          imagePullPolicy: Never
          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ID
              value: "node1"
            - name: STORAGE_DIR
              value: "/data"
            - name: METADATA_URL
              value: "http://metadata:8000"
          volumeMounts:
            - name: storage-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: node1-pvc
