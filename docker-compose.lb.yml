
services:
  gateway1:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      BACKEND_URL: http://metadata:8000
      GATEWAY_INSTANCE: gateway1
    depends_on:
      - metadata
    restart: unless-stopped

  gateway2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      BACKEND_URL: http://metadata:8000
      GATEWAY_INSTANCE: gateway2
    depends_on:
      - metadata
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway1
      - gateway2
    restart: unless-stopped
